<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>播放器</title>
  <link rel="stylesheet" href="css/style.css">   <!-- 改动 1：引入样式 -->
</head>
<body>
  <h1>我的播放器</h1>


  <input type="file" id="picker" accept="audio/*">
  <p id="name">还没选歌</p>

  <div class="time">
  <span id="current">00:00</span>
  <input type="range" id="seekBar" min="0" max="100" value="0" step="0.1">
  <span id="duration">00:00</span>
</div>

  <audio id="audio"></audio>
<button id="playBtn">播放</button>
  
  <audio id="audio"></audio>

  <script src="js/main.js" defer></script>       <!-- 改动 3：引入脚本 -->
</body>
</html>
