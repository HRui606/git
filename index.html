<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>播放器</title>
</head>
<body>
  <h1>我的播放器</h1>

  <button id="btn">点我</button>

  <script>
    const btn = document.getElementById('btn');

    btn.addEventListener('click', () => {
      console.log('点到了');
    });
  </script>
</body>
</html>
