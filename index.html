<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>播放器</title>
  <link rel="stylesheet" href="css/style.css">   <!-- 改动 1：引入样式 -->
</head>
<body>
  <main class="player">
    <h1>我的播放器</h1>

    <label class="pick">
      选择音乐
      <input type="file" id="picker" accept="audio/*">
    </label>

    <p id="name">还没选歌</p>

    <audio id="audio"></audio>

    <div class="row">
      <button id="playBtn">播放</button>
    </div>

    <div class="row time">
      <span id="current">00:00</span>
      <input type="range" id="seekBar" min="0" max="100" value="0" step="0.1">
      <span id="duration">00:00</span>
    </div>

    <div class="row volume">
      <span>音量</span>
      <input type="range" id="volumeBar" min="0" max="1" step="0.01" value="0.7">
    </div>
  </main>

  <script src="js/main.js" defer></script>
</body>
</html>
